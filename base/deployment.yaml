apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopify-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopify-app
    spec:
      enableServiceLinks: false
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: app
          # Overridden per-app via `images:` (name: shopify-app).
          image: shopify-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # PORT must equal containerPort; override per-app if not 3000.
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: "production" }
            # Shared Postgres creds (skirmshop ns). Apps that previously read
            # DB_USER/DB_PASSWORD from their own -secrets keep working: the
            # explicit env below wins over envFrom for the same key.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
            # DB name defaults to `skirmshop`; override per-app (e.g. collections_tree).
            # INVARIANTE: `connection_limit` es OBLIGATORIO en toda DATABASE_URL
            # de este framework, y los overlays que sobrescriben esta variable
            # deben arrastrarlo.
            #
            # Sin él, Prisma dimensiona el pool con `cpus_fisicos * 2 + 1` LEIDO
            # DEL HOST, no del límite del contenedor. Estos pods van a `role:
            # edge` (sauvage, 48 vCPU) y el manifiesto no fija cpu limit, así
            # que el techo por PrismaClient es ~49 — y son dos clientes, porque
            # el framework crea el suyo en dist/db/client.js además del que
            # instancia la app.
            #
            # Medido el 28-07-2026: bundles-app sostenía 96 conexiones físicas
            # con 1 réplica y 0 activas, primer consumidor de postgres-shared
            # (367/400 en total, 361 de ellas ociosas). Ver el postmortem en
            # k8s-infra-pocharlies/databases/postgres-shared/role-settings.yaml.
            #
            # 5 por cliente = 10/pod, 20 durante un rolling update. Sube el
            # número en el overlay si un app demuestra que necesita más.
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connection_limit=5&pool_timeout=15&connect_timeout=10" }
            # AUTH INVARIANT: must equal the public path-prefixed URL exactly
            # (https://skirmshop.e-dani.com/<prefix>). Mismatch breaks Shopify OAuth.
            - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/REPLACE-PREFIX" }
            - { name: SCOPES, value: "read_products,write_products" }
          envFrom:
            # Overlay sets the real secret name (e.g. bundles-secrets).
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
